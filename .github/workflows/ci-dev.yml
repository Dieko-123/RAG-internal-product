name: CI Dev

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev

env:
  VITE_CONVEX_URL: https://example.convex.cloud
  VITE_CLERK_PUBLISHABLE_KEY: pk_test_placeholder

jobs:
  checks:
    name: Lint, typecheck, build, and guards
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Secret guard
        run: node scripts/ci/guard-secrets.mjs

      - name: Stack guard
        run: node scripts/ci/guard-stack.mjs
